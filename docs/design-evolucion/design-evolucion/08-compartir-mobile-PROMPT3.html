<div style="width:390px;height:860px;box-sizing:border-box;padding:0;background:#5E4A85;font-family:'Montserrat',system-ui,sans-serif;color:#2B2145;overflow:hidden">
<div style="height:100%;display:flex;flex-direction:column;justify-content:flex-end"><div style="background:#fff;border-radius:32px 32px 0 0;padding:12px 20px 28px;box-shadow:0 -12px 40px rgba(43,33,69,.25)"><div style="width:44px;height:5px;border-radius:999px;background:#DDD0F0;margin:0 auto 16px"></div><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div style="width:44px;height:44px;border-radius:16px;background:#F1EAFB;color:#6F4CA6;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg></div><h1 style="margin:0;flex:1;font-family:'Walkyo','Montserrat',sans-serif;font-size:21px;line-height:1.2;font-weight:800">Resumen para llevar a una sesión</h1><button type="button" aria-label="Cerrar" style="width:44px;height:44px;border-radius:16px;border:0;background:#F5F0FC;color:#6F4CA6;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div><div style="font-size:14px;line-height:1.5;color:#675E78;margin-bottom:16px">Elegí qué incluir. Armamos un PDF con lo mismo que ves en pantalla.</div><div style="display:flex;flex-direction:column;gap:10px"><label style="display:flex;gap:14px;align-items:center;min-height:60px;padding:10px 16px;border:2px solid #E6DCF5;border-radius:20px;background:#fff;cursor:pointer"><input type="checkbox" checked style="width:24px;height:24px;accent-color:#6F4CA6;flex-shrink:0;margin:0"><span style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">Cambios del período</span><span style="font-size:12.5px;color:#675E78;margin-top:2px">Autonomía, ánimo y actividad</span></span></label><label style="display:flex;gap:14px;align-items:center;min-height:60px;padding:10px 16px;border:2px solid #E6DCF5;border-radius:20px;background:#fff;cursor:pointer"><input type="checkbox" checked style="width:24px;height:24px;accent-color:#6F4CA6;flex-shrink:0;margin:0"><span style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">Semana a semana</span><span style="font-size:12.5px;color:#675E78;margin-top:2px">Gráficos con sus valores</span></span></label><label style="display:flex;gap:14px;align-items:center;min-height:60px;padding:10px 16px;border:2px solid #E6DCF5;border-radius:20px;background:#fff;cursor:pointer"><input type="checkbox" checked style="width:24px;height:24px;accent-color:#6F4CA6;flex-shrink:0;margin:0"><span style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">Informe de vocabulario</span><span style="font-size:12.5px;color:#675E78;margin-top:2px">Frases y palabras más usadas</span></span></label><label style="display:flex;gap:14px;align-items:center;min-height:60px;padding:10px 16px;border:2px solid #E6DCF5;border-radius:20px;background:#fff;cursor:pointer"><input type="checkbox" checked style="width:24px;height:24px;accent-color:#6F4CA6;flex-shrink:0;margin:0"><span style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">Patrones detectados</span><span style="font-size:12.5px;color:#675E78;margin-top:2px">Solo los que tienen confianza</span></span></label></div><div style="display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px;background:#EEF6FF;border-radius:18px;font-size:13px;line-height:1.5;color:#1F4B6B"><div style="margin-top:1px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></div><div><b>No incluye</b> notas privadas de sesión ni ubicación. Tiene información personal: compartilo solo con quien acompaña a esta persona.</div></div><button type="button" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;margin-top:18px;border:0;border-radius:20px;background:linear-gradient(135deg,#6F4CA6,#7D58B5);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(111,76,166,.3)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>Descargar PDF</button><button type="button" style="display:block;width:100%;min-height:48px;margin-top:8px;border:0;background:transparent;font-size:15px;font-weight:700;color:#584E6E;cursor:pointer">Cancelar</button></div></div>
</div>
